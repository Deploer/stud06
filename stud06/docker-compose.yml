---
version: '3'
services:
    maven:
        image: maven:3.9.6-eclipse-temurin-20-alpine
        volumes:
            - './app:/app'
    tomcat:
        image: tomcat:10.1.27-jdk20-temurin-focal
        restart: 'on-failure'
        depends_on:
            - maven
        ports:
            - '8080:8080'
        volumes:
            - './app:/usr/local/tomcat/webapps'
                
