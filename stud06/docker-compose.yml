version: '3'

services:
  maven:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: mvn package -DskipTests

  tomcat:
    image: tomcat:9-jre8-temurin-jammy
    depends_on:
      - maven
    ports:
      - '8080:8080'
    volumes:
      - ./target:/usr/local/tomcat/webapps
    command: >
      bash -c "cp /usr/local/tomcat/webapps/*.war /usr/local/tomcat/webapps/ROOT.war && catalina.sh run"

