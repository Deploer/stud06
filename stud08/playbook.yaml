---
- name: setup maven
  hosts: web
  become: true
  tasks:
  - name: Ensure maven package is present
    apt:
      name: maven
      state: present
  - name: Ensure git package is present
    apt:
      name: git
      state: present
  - name: Ensure openjdk-11-jdk package is present
    apt:
      name: openjdk-11-jdk
      state: present
  - name: Ensure tomcat9 package is present
    apt:
      name: tomcat9
      state: present

