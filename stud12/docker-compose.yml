version: '3'

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      
mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
      MYSQL_USER: user_db
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
      volumes:
        - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
 
